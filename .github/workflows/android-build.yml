name: Android Build

on:
  push:
    branches: [fongmi, 'ci/**']
    paths:
      - "app/**"
      - "catvod/**"
      - "quickjs/**"
      - "chaquo/**"
      - "buildSrc/**"
      - "app/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [fongmi]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_JAVA_OPTS: -Xmx3072m

jobs:
  build:
    name: assemble (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: mobileDebug
            flavor: mobile
          - variant: leanbackDebug
            flavor: leanback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must run before the SDK setup: sdkmanager itself needs JAVA_HOME.
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships the SDK at /usr/local/lib/android/sdk but exports
      # neither ANDROID_HOME/ANDROID_SDK_ROOT nor a PATH entry for sdkmanager,
      # which is why every sdkmanager call previously exited 127.
      # We wire up the pre-installed SDK instead of pulling a third-party
      # action: android-actions/setup-android@v3 fails on
      # "Failed to find package 'tools'", a package long removed from the SDK
      # repository. Nothing is downloaded here.
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK not found at $SDK_ROOT"; exit 1; }
          CMDLINE_BIN=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          test -n "$CMDLINE_BIN" || {
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            ls -R "$SDK_ROOT/cmdline-tools" | head -30
            exit 1
          }
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "$(dirname "$CMDLINE_BIN")" >> "$GITHUB_PATH"
          echo "sdkmanager: $CMDLINE_BIN"
          ls "$SDK_ROOT"

      # `yes` exits 141 (SIGPIPE) as soon as sdkmanager closes stdin, so the
      # pipeline exit status comes from `yes` and cannot be trusted. Assert on
      # the output instead -- and dump the whole log when the assertion fails,
      # so a missing sdkmanager (127) can never pass unnoticed again.
      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /tmp/licenses.log 2>&1 || true
          tail -n 5 /tmp/licenses.log
          if ! grep -qiE "licenses? accepted|already accepted" /tmp/licenses.log; then
            echo "::error::sdkmanager did not report accepted licenses"
            cat /tmp/licenses.log
            exit 1
          fi

      # API 37 ships as minor-versioned platform packages (android-37.0 /
      # 37.1 / 37.2) -- a bare "platforms;android-37" does not exist and makes
      # sdkmanager fail immediately. build-tools 37.0.0 supplies the
      # zipalign + apksigner.jar used by AbiApkPackaging.groovy.
      # NDK is intentionally omitted: the vendored -release.aar modules ship
      # pre-built .so files and nothing in this profile is cross-compiled.
      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          sdkmanager --list_installed

      # CRITICAL: app/build.gradle:9 unconditionally reads local.properties.
      # Without this step, gradle configure fails with FileNotFoundException.
      - name: Generate local.properties
        run: |
          test -n "$ANDROID_SDK_ROOT" || { echo "::error::ANDROID_SDK_ROOT is empty"; exit 1; }
          printf 'sdk.dir=%s\nstoreFile=\nkeyAlias=\nstorePassword=\nkeyPassword=\n' "$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      # Sole cache owner: setup-gradle caches the Gradle User Home (including
      # Chaquopy's downloads) and the wrapper distribution. A separate
      # actions/cache step would duplicate the same paths under different keys.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Print environment
        run: |
          java -version
          ./gradlew --version
          echo "SDK: $ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT/build-tools/" || true

      - name: Build ${{ matrix.variant }}
        run: ./gradlew :app:assemble${{ matrix.variant }} --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-${{ matrix.variant }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
