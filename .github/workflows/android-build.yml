      # alone on purpose: R, BuildConfig and every fully qualified class name in
      # the manifest are generated from it. Changing it would mean editing Java
      # sources, which this branch does not do.
      - name: Give the debug build its own application id
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          BASE = "com.fongmi.android.tv"
          SIDELOAD = BASE + ".sideload"
          path = pathlib.Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")

          # Exactly one hit, and it must look like an applicationId assignment:
          # a second occurrence would mean the file changed shape underneath us.
          assignments = re.findall(
              r"\n[ \t]*applicationId[ \t]+\"%s\"" % re.escape(BASE), text
          )
          if len(assignments) != 1:
              sys.exit("expected 1 applicationId assignment, found %d" % len(assignments))

          namespace = "namespace = '%s'" % BASE
          if namespace not in text:
              sys.exit("the namespace line is not in the expected form")

          updated = text.replace(
              'applicationId "%s"' % BASE, 'applicationId "%s"' % SIDELOAD, 1
          )
          if updated == text:
              sys.exit("nothing was rewritten")
          path.write_text(updated, encoding="utf-8")

          # Read it back, so a stale or missed write fails here rather than nine
          # minutes later, halfway through packaging.
          check = path.read_text(encoding="utf-8")
          if 'applicationId "%s"' % SIDELOAD not in check:
              sys.exit("the rewrite did not stick")
          if 'applicationId "%s"' % BASE in check:
              sys.exit("the original application id is still there")
          if namespace not in check:
              sys.exit("the namespace must stay untouched")
          print("applicationId -> %s" % SIDELOAD)
          print("namespace     -> %s (unchanged)" % BASE)
          PY
          git --no-pager diff --unified=2 app/build.gradle

      - name: Print environment
        run: |
          java -version
          python3 --version || true
          ./gradlew --version
          echo "SDK: $ANDROID_SDK_ROOT"
          ls -la app/libs/

      - name: Build ${{ matrix.variant }}
        run: ./gradlew :app:assemble${{ matrix.variant }} --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-${{ matrix.variant }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
