      # .configurePlayerView() runs from initView and fires them before the
      # playback service connects and syncPlayerView() calls bind(). Without
      # the buffer, the HTTP client, the config and the enabled flag would be
      # silently dropped and danmaku would come up at its defaults. close()
      # only drops the reference: the PlayerView owns the controller and
