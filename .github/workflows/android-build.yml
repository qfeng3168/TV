      # next step injects: a duplicate definition would otherwise surface as a
      # confusing error much later, inside the app compile.
      #
      # Only DanmakuPlayerViewController is looked for by name inside
      # media3/ui/danmaku; the rest of that package (DanmakuView,
      # DanmakuController, DanmakuConfig, the fetchers, the parsers) IS
      # published, and matching the package would flag every AAR.
      - name: Check the AARs do not already ship the missing classes
        run: |
          found=""
          for aar in app/libs/*.aar; do
            unzip -l "$aar" | grep -q "classes.jar" || continue
            unzip -p "$aar" classes.jar > "$RUNNER_TEMP/classes.jar" || continue
