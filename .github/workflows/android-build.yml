      # .getFamilyName returns null. The style settings the user changes in
      # the UI still apply, through the independent path in
      # PlaybackActivity:430 / SubtitleSettingPanel:459.
      #
      # SecondaryTextTrackSelector.Factory delegates to the DecodeTrackSelector
      # factory it wraps. It sits in the preload manager's trackSelectorFactory
      # slot, i.e. the slot that normally holds DefaultTrackSelector.Factory,
      # so returning anything other than a working selector would break video,
      # audio and primary subtitle selection rather than just the second
      # subtitle track.
      #
      # The eleventh class, DanmakuPlayerViewController, is NOT in that
      # category, and is written as a real implementation rather than a stub.
      # FongMi/media publishes the entire danmaku subsystem in its ui_danmaku
      # module -- DanmakuView, DanmakuController, DanmakuConfig, the fetchers,
      # the parsers -- and lib-ui-release.aar therefore ships
      # PlayerView.getDanmakuView() / getDanmakuController() with the
      # controller already wired to the DanmakuView in exo_player_view.xml
      # (id exo_danmaku) and already following setPlayer(). The only thing
      # missing is the thin facade PlaybackActivity holds, and every call it
      # makes has a public equivalent on PlayerView:
      #
      #   setOkHttpClient    -> setDanmakuOkHttpClient
      #   setDataSource      -> setDanmakuSource
      #   setConfig          -> setDanmakuConfig
      #   setEnabled         -> setDanmakuEnabled
      #   sendNow            -> sendDanmaku
