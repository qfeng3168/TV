              "media3/exoplayer/libass\|media3/ui/libass\|SecondaryText\|media3/ui/danmaku/DanmakuPlayerViewController"; then
              found="$found $(basename "$aar")"
            fi
          done
          if [ -n "$found" ]; then
            echo "::error::the media AARs already contain the classes this workflow injects:$found"
            echo "The injected sources below are no longer needed; drop this step and the inject step."
            exit 1
          fi
          echo "none of the injected classes are in the media AARs, injection is still required"

