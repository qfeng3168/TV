      # The fongmi branch references eleven classes that a clean clone cannot
      # compile against. Ten of them exist only in the author's private media
      # fork:
      #
      #   androidx.media3.exoplayer.libass.{LibassConfiguration,
      #     LibassPlaybackSession, LibassSubtitleController, LibassFontFile,
      #     LibassNative, LibassFrame, LibassImage}
      #   androidx.media3.exoplayer.text.SecondaryTextOutput
      #   androidx.media3.exoplayer.trackselection.SecondaryTextTrackSelector
      #   androidx.media3.ui.libass.LibassPlayerViewController
      #
      # FongMi/media is public but stops at release-1.11.0-fongmi, which
      # predates the libass work entirely (no branch, no tag, zero hits for
      # "libass" in its tree), and the author's answer to the upstream report
      # in FongMi/TV#729 was to generate them yourself. Without them javac
      # fails with "cannot find symbol" at every call site, which is the only
      # reason this repository does not build from a clean clone.
      #
      # They are injected here instead of committed, so the tree keeps its
      # single diff from upstream (.github/). The ten are a deliberate
      # degradation, not a re-implementation:
      #
      #   LibassPlaybackSession.isAvailable() returns false unconditionally.
      #   That one value is the only guard the app has ever consulted before
      #   handing work to the native renderer -- ExoMediaSourceFactory:118 and
      #   ExoUtil:145 both short-circuit on it -- so libass is never entered
      #   and playback falls back to the stock media3 subtitle path.
