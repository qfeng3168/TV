name: Android Build

on:
  push:
    branches: [fongmi, 'ci/**']
    paths:
      - "app/**"
      - "catvod/**"
      - "quickjs/**"
      - "chaquo/**"
      - "buildSrc/**"
      - "app/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [fongmi]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The player dependency is not in this repository: app/libs/.gitignore
  # excludes 'lib-*.aar' and README states that a plain clone lacks the full
  # player dependency. Those AARs come from the FongMi fork of androidx/media,
  # which is public, so they are built here rather than committed or smuggled
  # through a secret (a GitHub secret caps at 48 KB; the set is ~150 MB).
  MEDIA_REPO: https://github.com/FongMi/media.git
  # Pinned to the release-1.11.0-fongmi tip so the build is reproducible.
  MEDIA_REF: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
  MEDIA_AARS: |
    lib-common-release.aar
    lib-container-release.aar
    lib-database-release.aar
    lib-datasource-release.aar
    lib-datasource-okhttp-release.aar
    lib-datasource-rtmp-release.aar
    lib-decoder-release.aar
    lib-decoder-ffmpeg-release.aar
    lib-decoder-mpegh-release.aar
    lib-effect-release.aar
    lib-exoplayer-release.aar
    lib-exoplayer-dash-release.aar
    lib-exoplayer-hls-release.aar
    lib-exoplayer-rtsp-release.aar
    lib-exoplayer-smoothstreaming-release.aar
    lib-extractor-release.aar
    lib-mpvplayer-release.aar
    lib-session-release.aar
    lib-ui-release.aar
    lib-ui-danmaku-release.aar
  # The upstream signed APK only exists on raw.githubusercontent.com, which the
  # development machine cannot reach (the connection is reset). It is fetched on
  # the runner instead, so the package that is already installed on the device
  # can be restored once the sideload build has been tested.
  RELEASE_RAW: https://raw.githubusercontent.com/FongMi/Release/fongmi/apk
  RELEASE_APK: leanback-arm64_v8a.apk

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: produce the media3 AARs the app compiles against. This is the
  # list in FongMi/media/move.txt, which the upstream author copies into
  # app/libs/ with move.bat; every entry maps to a :lib-* Gradle project.
  # ---------------------------------------------------------------------------
  media-aar:
    name: build media3 AARs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships the SDK at /usr/local/lib/android/sdk but exports
      # neither ANDROID_HOME/ANDROID_SDK_ROOT nor a PATH entry for sdkmanager,
      # so it is wired up here instead of via a third-party action.
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK not found at $SDK_ROOT"; exit 1; }
          CMDLINE_BIN=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          test -n "$CMDLINE_BIN" || {
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            ls -R "$SDK_ROOT/cmdline-tools" | head -30
            exit 1
          }
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "$(dirname "$CMDLINE_BIN")" >> "$GITHUB_PATH"

      # `yes` exits 141 (SIGPIPE) once sdkmanager closes stdin, so the pipeline
      # status cannot be trusted. Assert on the output instead, and dump the
      # log when the assertion fails so a missing sdkmanager cannot pass.
      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /tmp/licenses.log 2>&1 || true
          tail -n 5 /tmp/licenses.log
          if ! grep -qiE "licenses? accepted|already accepted" /tmp/licenses.log; then
            echo "::error::sdkmanager did not report accepted licenses"
            cat /tmp/licenses.log
            exit 1
          fi

      # Package names verified against the SDK repository XML: platform 36 ships
      # bare ("android-36"), whereas API 37 is minor-versioned ("android-37.0")
      # and a bare "platforms;android-37" does not exist. media/ compiles
      # against 36, TV/ against 37.0.
      #
      # NDK 29 is not decorative: libraries/decoder_ffmpeg sets
      #   ndkVersion = native-dependencies...["android.ndk.version"] = 29.0.14206865
      # and its CMake path IS armed, because the guard
      #   if (project.file("src/main/ffmpeg/include/libavcodec/avcodec.h").exists())
      # is satisfied -- the FFmpeg headers (48 files) and the libplacebo
      # renderer SDK (73 files, incl. lib/libplacebo.a for both ABIs) are
      # committed in the fork. So libffmpegJNI is really compiled here.
      - name: Install required SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          sdkmanager --list_installed

      # The native libraries are already committed in the fork, so neither
      # FongMi/mpv nor FongMi/FFmpeg has to be compiled:
      #   libraries/mpvplayer/src/main/jniLibs/{arm64-v8a,armeabi-v7a}/libmpv.so
      #   libraries/decoder_ffmpeg/src/main/jniLibs/*/libav*.so
      - name: Checkout media fork
        run: |
          mkdir media && cd media
          git init -q
          git remote add origin "$MEDIA_REPO"
          if git fetch --depth 1 origin "$MEDIA_REF" 2>/dev/null; then
            git checkout -q FETCH_HEAD
          else
            echo "::warning::MEDIA_REF $MEDIA_REF could not be fetched directly; falling back to the release-1.11.0-fongmi tip."
            git fetch --depth 1 origin release-1.11.0-fongmi
            git checkout -q FETCH_HEAD
          fi
          git log -1 --oneline

      # ---------------------------------------------------------------------
      # The mpvplayer module in the public fork predates the dual-subtitle work
      # the app was written against, so two of its published classes are
      # missing members the app calls:
      #
      #   MpvPlayer                getPrimaryTextTrackSelectionOverride
      #                            getSecondaryTextTrackSelectionOverride
      #                            getSecondaryTextTrackSelectionOverrides
      #                            isSecondaryTextTrackSuppressed
      #                            setSecondaryTextTrackSelectionOverride
      #                            resetSecondaryTextTrackSelection
      #                            setSecondaryTextTrackAutoSelectionEnabled
      #   MpvSubtitleOptions.Builder
      #                            setSecondarySubtitlePosition
      #                            setSecondaryAssStyleOverride
      #                            setFontFamily
      #                            setFontsDirectory
      #
      # These cannot be injected as extra sources the way the missing libass
      # classes are: the classes themselves ship in the AAR, and a second
      # definition of a name that is already on the classpath is a duplicate
      # class, not an override. They are patched into the fork instead, before
      # it is built, so the tree keeps its single diff from upstream.
      #
      # Only the primary text track override is implemented for real, and only
      # because it is a plain read: MpvTrackController already exposes the
      # parameters and the tracks, and MpvTrackSelectionApplier resolves the
      # very same override in order to write mpv's sid. The secondary text track
      # is not implemented. The fork has no published path to mpv's
      # secondary-sid -- only MpvSubtitleOptions carries it, and rebuilding
      # those options from MpvPlayer would mean guessing the author's intent for
      # every other field in them. So this player reports no secondary text
      # track at all: null, an empty candidate list, no-op setters. That trio is
      # self-consistent and is what the settings panel already handles as
      # "nothing to pick", which means no caller can reach a setter that would
      # silently do nothing. Dual subtitles are therefore unavailable on both
      # engines in this build.
      #
      # The two font setters are implemented for real, and are why
      # MpvSubtitleOptionDefaults grows two option names. Without them the font
      # the user picks for mpv subtitles would be dropped on the floor, and
      # "sub-font"/"sub-fonts-dir" are already in the app's managed option list.
      - name: Patch the mpvplayer module
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          ROOT = pathlib.Path("media/libraries/mpvplayer/src/main/java/androidx/media3/mpvplayer")


          def patch(relative, *replacements):
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              before = (text.count("{"), text.count("}"))
              for old, new in replacements:
                  occurrences = text.count(old)
                  if occurrences != 1:
                      print("::error::" + relative + ": anchor matched "
                            + str(occurrences) + " times, expected exactly 1")
                      print(old)
                      sys.exit(1)
                  text = text.replace(old, new)
              after = (text.count("{"), text.count("}"))
              added = (after[0] - before[0], after[1] - before[1])
              if added[0] != added[1] or added[0] == 0:
                  print("::error::" + relative + ": patch added unbalanced braces " + str(added))
                  sys.exit(1)
              path.write_text(text, encoding="utf-8")
              print("patched " + relative + " (+" + str(added[0]) + " blocks)")


          patch(
              "MpvSubtitleOptions.java",
              (
                  "import androidx.annotation.RestrictTo;\n"
                  "import com.google.errorprone.annotations.CanIgnoreReturnValue;\n",
                  "import androidx.annotation.Nullable;\n"
                  "import androidx.annotation.RestrictTo;\n"
                  "import com.google.errorprone.annotations.CanIgnoreReturnValue;\n",
              ),
              (
                  "  private final boolean secondaryOverrideAssStyles;\n"
                  "\n"
                  "  private MpvSubtitleOptions(Builder builder) {\n",
                  "  private final boolean secondaryOverrideAssStyles;\n"
                  "  @Nullable private final String fontFamily;\n"
                  "  @Nullable private final String fontsDirectory;\n"
                  "\n"
                  "  private MpvSubtitleOptions(Builder builder) {\n",
              ),
              (
                  "    secondaryOverrideAssStyles = builder.secondaryOverrideAssStyles;\n"
                  "  }\n",
                  "    secondaryOverrideAssStyles = builder.secondaryOverrideAssStyles;\n"
                  "    fontFamily = builder.fontFamily;\n"
                  "    fontsDirectory = builder.fontsDirectory;\n"
                  "  }\n",
              ),
              (
                  "  /** Builder for {@link MpvSubtitleOptions}. */\n"
                  "  public static final class Builder {\n",
                  "  /**\n"
                  "   * Returns the font family to render subtitles with, or {@code null} to let the player\n"
                  "   * choose one.\n"
                  "   */\n"
                  "  public @Nullable String getFontFamily() {\n"
                  "    return fontFamily;\n"
                  "  }\n"
                  "\n"
                  "  /** Returns the directory to load subtitle fonts from, or {@code null} for the default. */\n"
                  "  public @Nullable String getFontsDirectory() {\n"
                  "    return fontsDirectory;\n"
                  "  }\n"
                  "\n"
                  "  /** Builder for {@link MpvSubtitleOptions}. */\n"
                  "  public static final class Builder {\n",
              ),
              (
                  "    private boolean secondaryOverrideAssStyles;\n"
                  "    private boolean buildCalled;\n",
                  "    private boolean secondaryOverrideAssStyles;\n"
                  "    @Nullable private String fontFamily;\n"
                  "    @Nullable private String fontsDirectory;\n"
                  "    private boolean buildCalled;\n",
              ),
              (
                  "    public MpvSubtitleOptions build() {\n",
                  "    /** Sets the font family used to render subtitles. */\n"
                  "    @CanIgnoreReturnValue\n"
                  "    public Builder setFontFamily(String fontFamily) {\n"
                  "      checkState(!buildCalled);\n"
                  "      this.fontFamily = fontFamily;\n"
                  "      return this;\n"
                  "    }\n"
                  "\n"
                  "    /** Sets the directory that subtitle fonts are loaded from. */\n"
                  "    @CanIgnoreReturnValue\n"
                  "    public Builder setFontsDirectory(String fontsDirectory) {\n"
                  "      checkState(!buildCalled);\n"
                  "      this.fontsDirectory = fontsDirectory;\n"
                  "      return this;\n"
                  "    }\n"
                  "\n"
                  "    /**\n"
                  "     * Sets the vertical position of the secondary subtitle, as a percentage of the screen\n"
                  "     * height.\n"
                  "     *\n"
                  "     * <p>Configuring the secondary subtitle without selecting a track for it leaves it off,\n"
                  "     * which is the same state as not calling this at all.\n"
                  "     */\n"
                  "    @CanIgnoreReturnValue\n"
                  "    public Builder setSecondarySubtitlePosition(float position) {\n"
                  "      checkState(!buildCalled);\n"
                  "      secondarySubtitleConfigured = true;\n"
                  "      secondaryPosition = position;\n"
                  "      return this;\n"
                  "    }\n"
                  "\n"
                  "    /** Sets whether the secondary subtitle ignores the ASS styles carried by the file. */\n"
                  "    @CanIgnoreReturnValue\n"
                  "    public Builder setSecondaryAssStyleOverride(boolean overrideAssStyles) {\n"
                  "      checkState(!buildCalled);\n"
                  "      secondarySubtitleConfigured = true;\n"
                  "      secondaryOverrideAssStyles = overrideAssStyles;\n"
                  "      return this;\n"
                  "    }\n"
                  "\n"
                  "    public MpvSubtitleOptions build() {\n",
              ),
          )

          patch(
              "options/MpvSubtitleOptionDefaults.java",
              (
                  '  private static final String OPT_SUBTITLE_COLOR = "sub-color";\n',
                  '  private static final String OPT_SUBTITLE_COLOR = "sub-color";\n'
                  '  private static final String OPT_SUBTITLE_FONT = "sub-font";\n'
                  '  private static final String OPT_SUBTITLE_FONTS_DIR = "sub-fonts-dir";\n',
              ),
              (
                  "    if (options.isSecondarySubtitleConfigured()) {\n"
                  "      addSecondarySubtitleOptions(builder, options);\n"
                  "    }\n"
                  "    return builder;\n",
                  "    @Nullable String fontFamily = options.getFontFamily();\n"
                  "    if (fontFamily != null) {\n"
                  "      addSubtitleString(builder, OPT_SUBTITLE_FONT, fontFamily);\n"
                  "    }\n"
                  "    @Nullable String fontsDirectory = options.getFontsDirectory();\n"
                  "    if (fontsDirectory != null) {\n"
                  "      addSubtitleString(builder, OPT_SUBTITLE_FONTS_DIR, fontsDirectory);\n"
                  "    }\n"
                  "    if (options.isSecondarySubtitleConfigured()) {\n"
                  "      addSecondarySubtitleOptions(builder, options);\n"
                  "    }\n"
                  "    return builder;\n",
              ),
          )

          patch(
              "MpvPlayer.java",
              (
                  "import androidx.media3.common.TrackSelectionParameters;\n",
                  "import androidx.media3.common.TrackGroup;\n"
                  "import androidx.media3.common.TrackSelectionOverride;\n"
                  "import androidx.media3.common.TrackSelectionParameters;\n"
                  "import androidx.media3.common.Tracks;\n",
              ),
              (
                  "    runOnPlayerLooper(() -> subtitleController.setOptions(config));\n"
                  "  }\n",
                  "    runOnPlayerLooper(() -> subtitleController.setOptions(config));\n"
                  "  }\n"
                  "\n"
                  "  /**\n"
                  "   * Returns the override that selects the primary text track, or {@code null} if the primary\n"
                  "   * text track is chosen automatically.\n"
                  "   */\n"
                  "  public @Nullable TrackSelectionOverride getPrimaryTextTrackSelectionOverride() {\n"
                  "    TrackSelectionParameters parameters = trackController.getParameters();\n"
                  "    Tracks tracks = trackController.getTracks();\n"
                  "    TrackSelectionOverride selected = null;\n"
                  "    for (TrackSelectionOverride override : parameters.overrides.values()) {\n"
                  "      if (override.getType() == C.TRACK_TYPE_TEXT\n"
                  "          && hasTrackGroup(tracks, override.mediaTrackGroup)) {\n"
                  "        selected = override;\n"
                  "      }\n"
                  "    }\n"
                  "    return selected;\n"
                  "  }\n"
                  "\n"
                  "  /**\n"
                  "   * Returns the override that selects the secondary text track, or {@code null} if none is\n"
                  "   * selected.\n"
                  "   *\n"
                  "   * <p>Always {@code null} in this build. This module is built from the public fork, which\n"
                  "   * has no secondary text track support: the app that consumes it was written against a\n"
                  "   * private branch, and nothing published reaches mpv's secondary-sid. Reporting no\n"
                  "   * secondary text track keeps this class consistent with its own candidate list, which is\n"
                  "   * empty for the same reason.\n"
                  "   */\n"
                  "  public @Nullable TrackSelectionOverride getSecondaryTextTrackSelectionOverride() {\n"
                  "    return null;\n"
                  "  }\n"
                  "\n"
                  "  /**\n"
                  "   * Returns the overrides that could be selected as the secondary text track.\n"
                  "   *\n"
                  "   * <p>Always empty in this build; see {@link #getSecondaryTextTrackSelectionOverride}.\n"
                  "   */\n"
                  "  public List<TrackSelectionOverride> getSecondaryTextTrackSelectionOverrides() {\n"
                  "    return List.of();\n"
                  "  }\n"
                  "\n"
                  "  /**\n"
                  "   * Returns whether the secondary text track has been promoted to the primary one.\n"
                  "   *\n"
                  "   * <p>Always {@code false} in this build; see\n"
                  "   * {@link #getSecondaryTextTrackSelectionOverride}.\n"
                  "   */\n"
                  "  public boolean isSecondaryTextTrackSuppressed() {\n"
                  "    return false;\n"
                  "  }\n"
                  "\n"
                  "  /**\n"
                  "   * Sets the override that selects the secondary text track.\n"
                  "   *\n"
                  "   * <p>Does nothing in this build. No caller can reach it either: selections are picked from\n"
                  "   * {@link #getSecondaryTextTrackSelectionOverrides}, which is empty.\n"
                  "   */\n"
                  "  public void setSecondaryTextTrackSelectionOverride(\n"
                  "      @Nullable TrackSelectionOverride selection) {\n"
                  "    // Unsupported: see getSecondaryTextTrackSelectionOverride.\n"
                  "  }\n"
                  "\n"
                  "  /** Clears the secondary text track selection. Does nothing in this build. */\n"
                  "  public void resetSecondaryTextTrackSelection() {\n"
                  "    // Unsupported: see getSecondaryTextTrackSelectionOverride.\n"
                  "  }\n"
                  "\n"
                  "  /**\n"
                  "   * Enables or disables automatic selection of the secondary text track.\n"
                  "   *\n"
                  "   * <p>Does nothing in this build; see {@link #getSecondaryTextTrackSelectionOverride}.\n"
                  "   */\n"
                  "  public void setSecondaryTextTrackAutoSelectionEnabled(boolean enabled) {\n"
                  "    // Unsupported: see getSecondaryTextTrackSelectionOverride.\n"
                  "  }\n"
                  "\n"
                  "  private static boolean hasTrackGroup(Tracks tracks, TrackGroup group) {\n"
                  "    for (Tracks.Group candidate : tracks.getGroups()) {\n"
                  "      if (candidate.getMediaTrackGroup().equals(group)) {\n"
                  "        return true;\n"
                  "      }\n"
                  "    }\n"
                  "    return false;\n"
                  "  }\n",
              ),
          )

          # The patch is text, so prove the result rather than trusting it: every
          # member the app calls has to be there, or the failure is a runner and
          # a gradle stack trace away instead of three lines above it.
          EXPECTED = {
              "MpvPlayer.java": (
                  "getPrimaryTextTrackSelectionOverride",
                  "getSecondaryTextTrackSelectionOverride",
                  "getSecondaryTextTrackSelectionOverrides",
                  "isSecondaryTextTrackSuppressed",
                  "setSecondaryTextTrackSelectionOverride",
                  "resetSecondaryTextTrackSelection",
                  "setSecondaryTextTrackAutoSelectionEnabled",
              ),
              "MpvSubtitleOptions.java": (
                  "setFontFamily",
                  "setFontsDirectory",
                  "setSecondarySubtitlePosition",
                  "setSecondaryAssStyleOverride",
              ),
              "options/MpvSubtitleOptionDefaults.java": (
                  "OPT_SUBTITLE_FONT",
                  "OPT_SUBTITLE_FONTS_DIR",
              ),
          }
          missing = []
          added = 0
          for name, members in EXPECTED.items():
              text = (ROOT / name).read_text(encoding="utf-8")
              for member in members:
                  if member + "(" not in text and member + " " not in text:
                      missing.append(name + " -> " + member)
                  else:
                      added += 1
          if missing:
              print("::error::the patch left members missing: " + ", ".join(missing))
              sys.exit(1)
          print("mpvplayer patch verified: " + str(added) + " members present")
          PY

      - name: Build AARs
        run: |
          cd media
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          TASKS=""
          while read -r name; do
            [ -n "$name" ] || continue
            TASKS="$TASKS :${name%-release.aar}:assembleRelease"
          done <<< "$MEDIA_AARS"
          echo "tasks:$TASKS"
          # shellcheck disable=SC2086
          ./gradlew $TASKS --no-daemon --stacktrace

      # Fail loudly on any missing AAR rather than letting the app build die
      # later with an obscure "package androidx.media3.mpvplayer does not exist".
      - name: Collect AARs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/aars"
          find media/libraries -path "*/outputs/aar/lib-*-release.aar" -exec cp -v {} "$GITHUB_WORKSPACE/aars/" \;
          missing=""
          while read -r name; do
            [ -n "$name" ] || continue
            [ -f "$GITHUB_WORKSPACE/aars/$name" ] || missing="$missing $name"
          done <<< "$MEDIA_AARS"
          if [ -n "$missing" ]; then
            echo "::error::missing AARs:$missing"
            find media/libraries -name "lib-*.aar" | head -50
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/aars"

      - name: Upload AARs
        uses: actions/upload-artifact@v4
        with:
          name: media-aars
          path: aars/*.aar
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 2: build the app against those AARs.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # The device already runs the upstream signed release, and the point of the
  # sideload build is that the two coexist instead of replacing each other.
  # raw.githubusercontent.com is unreachable from the development machine, so the
  # release APK is fetched here and handed back as an artifact.
  # ---------------------------------------------------------------------------
  official-apk:
    name: fetch the official release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the release APK
        run: |
          mkdir -p apk
          curl -fSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "apk/$RELEASE_APK" "$RELEASE_RAW/$RELEASE_APK"
          ls -l apk/

      # Refuse to hand back something that is not the package we think it is.
      - name: Verify it really is an arm64 APK
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import sys
          import zipfile

          path = pathlib.Path("apk") / os.environ["RELEASE_APK"]
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
          if "AndroidManifest.xml" not in names:
              sys.exit("%s is not an APK" % path)
          abis = sorted({n.split("/")[1] for n in names if n.startswith("lib/")})
          if "arm64-v8a" not in abis:
              sys.exit("expected an arm64-v8a build, got %s" % abis)
          print("file:  ", path)
          print("bytes: ", path.stat().st_size)
          print("sha256:", hashlib.sha256(path.read_bytes()).hexdigest())
          print("abis:  ", abis)
          PY

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: official-leanback-arm64
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 7

  build:
    name: assemble (${{ matrix.variant }})
    needs: media-aar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: mobileDebug
            flavor: mobile
          - variant: leanbackDebug
            flavor: leanback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradlew is tracked without the exec bit, so ./gradlew dies with
      # "Permission denied" on a Linux runner.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch player AARs
        uses: actions/download-artifact@v4
        with:
          name: media-aars
          path: app/libs

      # README lists Python 3.10 among the build prerequisites: Chaquopy uses a
      # host interpreter (buildPython) to resolve and fetch the target packages
      # declared in chaquo/requirements.txt.
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Must run before the SDK setup: sdkmanager itself needs JAVA_HOME.
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK not found at $SDK_ROOT"; exit 1; }
          CMDLINE_BIN=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          test -n "$CMDLINE_BIN" || {
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            ls -R "$SDK_ROOT/cmdline-tools" | head -30
            exit 1
          }
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "$(dirname "$CMDLINE_BIN")" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /tmp/licenses.log 2>&1 || true
          tail -n 5 /tmp/licenses.log
          if ! grep -qiE "licenses? accepted|already accepted" /tmp/licenses.log; then
            echo "::error::sdkmanager did not report accepted licenses"
            cat /tmp/licenses.log
            exit 1
          fi

      # build-tools 37.0.0 supplies the zipalign + apksigner.jar used by
      # AbiApkPackaging.groovy for the ABI-split release packaging. The NDK and
      # CMake are for Chaquopy: when chaquo/requirements.txt resolves no
      # prebuilt wheel for a package it compiles that package from source.
      - name: Install required SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          sdkmanager --list_installed

      # CRITICAL: app/build.gradle:9 unconditionally reads local.properties.
      # Without this step, gradle configure fails with FileNotFoundException.
      #
      # The signingConfigs block is also evaluated for debug builds, and
      # app/build.gradle:49 does file(localProps['storeFile']). An empty value
      # aborts configure with "Cannot convert '' to File."; a missing value
      # fails the same way with null. Only the release variant ever reads the
      # keystore, so a throwaway release key satisfies evaluation.
      - name: Generate local.properties
        run: |
          test -n "$ANDROID_SDK_ROOT" || { echo "::error::ANDROID_SDK_ROOT is empty"; exit 1; }
          KEYSTORE="$RUNNER_TEMP/ci-release.keystore"
          rm -f "$KEYSTORE"
          keytool -genkeypair -keystore "$KEYSTORE" \
            -storetype PKCS12 -storepass android -keypass android \
            -alias cirelease -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=CI,O=CI,C=US"
          printf 'sdk.dir=%s\nstoreFile=%s\nkeyAlias=cirelease\nstorePassword=android\n' \
            "$ANDROID_SDK_ROOT" "$KEYSTORE" > local.properties
          cat local.properties

