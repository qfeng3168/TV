name: FongMi Release APK Recon

# The public FongMi/media fork does not contain the libass support that the
# fongmi branch of FongMi/TV depends on:
#   androidx.media3.exoplayer.libass.{LibassPlaybackSession,LibassConfiguration,
#     LibassSubtitleController,LibassFontFile}
#   androidx.media3.ui.libass.LibassPlayerViewController
#   androidx.media3.exoplayer.trackselection.SecondaryTextTrackSelector
#   androidx.media3.exoplayer.text.SecondaryTextOutput
# Issue #729 reported exactly this and the author answered "please generate it
# yourself with AI", so it will never be pushed. The released APK is the only
# public artifact that contains the compiled code, so this workflow pulls it
# and reports, with evidence, what can and cannot be recovered from it:
#   * native libraries (.so)       - recoverable verbatim
#   * dex class names              - which ones R8 kept and which it renamed
# Reconnaissance only: it is not part of the app build.

on:
  push:
    branches: [fongmi, 'ci/**']
    paths:
      - ".github/workflows/release-apk-recon.yml"
  workflow_dispatch:
    inputs:
      apk:
        description: "APK file name under apk/ in FongMi/Release"
        required: true
        default: "leanback-arm64_v8a.apk"

permissions:
  contents: read

concurrency:
  group: release-apk-recon-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_RAW: https://raw.githubusercontent.com/FongMi/Release/fongmi/apk

jobs:
  recon:
    name: download and analyse the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download APK
        run: |
          APK_NAME="${{ github.event.inputs.apk }}"
          APK_NAME="${APK_NAME:-leanback-arm64_v8a.apk}"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          mkdir -p apk
          curl -fSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "apk/$APK_NAME" "$RELEASE_RAW/$APK_NAME"
          ls -l "apk/$APK_NAME"
          # Prove it is really a zip before anything downstream trusts it.
          python3 -c "
          import sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              print('zip entries:', len(z.namelist()))
          " "apk/$APK_NAME"

      # Pure Python, no JDK: parses the dex string/type tables directly, which
      # is all that is needed to answer the decisive question - were the
      # original binary names of the libass classes kept, or renamed by R8?
      - name: Analyse dex and extract native libraries
        run: |
          python3 - <<'PY'
          import os
          import re
          import struct
          import zipfile

          APK = f"apk/{os.environ['APK_NAME']}"
          OUT = "out"
          os.makedirs(os.path.join(OUT, "native"), exist_ok=True)
          os.makedirs(os.path.join(OUT, "dex"), exist_ok=True)

          # Binary names the TV sources reference (app/src/main/java/com/fongmi/
          # android/tv/player/exo/*.java), i.e. what a compile dependency must
          # provide.
          WANTED = [
              "androidx/media3/exoplayer/libass/LibassPlaybackSession",
              "androidx/media3/exoplayer/libass/LibassConfiguration",
              "androidx/media3/exoplayer/libass/LibassSubtitleController",
              "androidx/media3/exoplayer/libass/LibassFontFile",
              "androidx/media3/exoplayer/libass/LibassNative",
              "androidx/media3/exoplayer/libass/LibassFrame",
              "androidx/media3/exoplayer/libass/LibassImage",
              "androidx/media3/ui/libass/LibassPlayerViewController",
              "androidx/media3/exoplayer/trackselection/SecondaryTextTrackSelector",
              "androidx/media3/exoplayer/text/SecondaryTextOutput",
          ]

          # dex header: magic(8) checksum(4) signature(20) then twenty u32s in
          # this order:
          #   file_size, header_size, endian_tag, link_size, link_off, map_off,
          #   string_ids_size, string_ids_off, type_ids_size, type_ids_off,
          #   proto_ids_size, proto_ids_off, field_ids_size, field_ids_off,
          #   method_ids_size, method_ids_off, class_defs_size, class_defs_off,
          #   data_size, data_off
          # unpack_from yields (magic, checksum, signature, *those twenty), so a
          # field's tuple index is 3 + its position above. Getting this off by
          # two silently yields a plausible-looking but meaningless result, so
          # the indices are named rather than inlined.
          HEADER = struct.Struct("<8sI20s20I")
          STRING_IDS_SIZE, STRING_IDS_OFF = 9, 10
          TYPE_IDS_SIZE, TYPE_IDS_OFF = 11, 12

          report = []


          def say(line=""):
              print(line)
              report.append(line)


          def read_uleb128(data, offset):
              result = 0
              shift = 0
              while True:
                  byte = data[offset]
                  offset += 1
                  result |= (byte & 0x7F) << shift
                  if not byte & 0x80:
                      return result, offset
                  shift += 7


          def dex_strings(blob):
              if blob[:4] != b"dex\n":
                  raise ValueError(f"not a dex file (magic={blob[:8]!r})")
              fields = HEADER.unpack_from(blob, 0)
              size = fields[STRING_IDS_SIZE]
              offset = fields[STRING_IDS_OFF]
              for index in range(size):
                  (str_off,) = struct.unpack_from("<I", blob, offset + index * 4)
                  _, cursor = read_uleb128(blob, str_off)
                  end = blob.index(b"\x00", cursor)
                  yield blob[cursor:end].decode("utf-8", "replace")


          def dex_types(blob):
              fields = HEADER.unpack_from(blob, 0)
              string_ids_size = fields[STRING_IDS_SIZE]
              string_ids_off = fields[STRING_IDS_OFF]
              type_ids_size = fields[TYPE_IDS_SIZE]
              type_ids_off = fields[TYPE_IDS_OFF]
              strings = []
              for index in range(string_ids_size):
                  (str_off,) = struct.unpack_from("<I", blob, string_ids_off + index * 4)
                  _, cursor = read_uleb128(blob, str_off)
                  end = blob.index(b"\x00", cursor)
                  strings.append(blob[cursor:end].decode("utf-8", "replace"))
              types = set()
              for index in range(type_ids_size):
                  (descriptor_idx,) = struct.unpack_from("<I", blob, type_ids_off + index * 4)
                  if descriptor_idx < len(strings):
                      types.add(strings[descriptor_idx])
              return types


          say(f"APK: {APK} ({os.path.getsize(APK):,} bytes)")

          with zipfile.ZipFile(APK) as archive:
              names = archive.namelist()
              dexs = sorted(n for n in names if re.fullmatch(r"classes\d*\.dex", n))
              libs = sorted(n for n in names if n.startswith("lib/") and n.endswith(".so"))

              say()
              say(f"== dex files ({len(dexs)}) ==")
              for name in dexs:
                  info = archive.getinfo(name)
                  say(f"  {name}  {info.file_size:,} bytes uncompressed")
                  with open(os.path.join(OUT, "dex", name), "wb") as handle:
                      handle.write(archive.read(name))

              say()
              say(f"== native libraries ({len(libs)}) ==")
              for name in libs:
                  size = archive.getinfo(name).file_size
                  basename = os.path.basename(name)
                  interesting = " <-- LIBASS" if "ass" in basename.lower() else ""
                  say(f"  {name}  {size:,} bytes{interesting}")

              # The libass JNI bridge is pulled out verbatim; it is also copied
              # below 1 MB along with a few siblings to keep the artifact small.
              pulled = []
              for name in libs:
                  basename = os.path.basename(name)
                  size = archive.getinfo(name).file_size
                  if "ass" in basename.lower() or size < 1024 * 1024:
                      target = os.path.join(OUT, "native", name.replace("/", "_"))
                      with open(target, "wb") as handle:
                          handle.write(archive.read(name))
                      pulled.append(name)
              say()
              say(f"== extracted native libraries ({len(pulled)}) ==")
              for name in pulled:
                  say(f"  {name}")

              per_dex = {}
              all_types = set()
              for name in dexs:
                  try:
                      types = dex_types(archive.read(name))
                  except Exception as exc:  # noqa: BLE001 - keep going, report it
                      say(f"  ! {name}: {exc}")
                      continue
                  per_dex[name] = types
                  all_types |= types

              say()
              say(f"== parsed {len(per_dex)} dex, {len(all_types):,} distinct types ==")
              for name, types in per_dex.items():
                  say(f"  {name}: {len(types):,} types")

              say()
              say("== are the original binary names present? ==")
              kept = 0
              for want in WANTED:
                  descriptor = f"L{want};"
                  found_in = [n for n, t in per_dex.items() if descriptor in t]
                  if found_in:
                      kept += 1
                      say(f"  KEPT    {want}  ({', '.join(found_in)})")
                  else:
                      say(f"  RENAMED {want}")
              say(f"  -> {kept}/{len(WANTED)} original names survive R8")

              say()
              say("== types whose descriptor mentions libass ==")
              hits = sorted(t for t in all_types if "libass" in t.lower())
              for t in hits[:80]:
                  say(f"  {t}")
              if not hits:
                  say("  (none)")

              say()
              say("== types under androidx/media3/exoplayer/libass ==")
              hits = sorted(t for t in all_types if t.startswith("Landroidx/media3/exoplayer/libass/"))
              for t in hits[:80]:
                  say(f"  {t}")
              if not hits:
                  say("  (none)")

              say()
              say("== obfuscation probe: are package names intact overall? ==")
              sample = sorted(all_types)
              androidx = sum(1 for t in sample if t.startswith("Landroidx/"))
              com_fongmi = sum(1 for t in sample if t.startswith("Lcom/fongmi/"))
              say(f"  Landroidx/* types:     {androidx:,}")
              say(f"  Lcom/fongmi/* types:   {com_fongmi:,}")
              say(f"  total types:           {len(sample):,}")

              say()
              say("== string constants mentioning libass / media3ass ==")
              for name in dexs:
                  blob = archive.read(name)
                  for text in dex_strings(blob):
                      low = text.lower()
                      if "libass" in low or "media3ass" in low:
                          say(f"  [{name}] {text!r}")

          with open(os.path.join(OUT, "report.txt"), "w", encoding="utf-8") as handle:
              handle.write("\n".join(report) + "\n")
          PY

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # baksmali turns the dex back into smali. R8 renamed seven of the ten
      # classes, so this is NOT a source of compilable symbols; it is the only
      # way to read the JNI bridge that survived verbatim (LibassNative,
      # LibassFrame, LibassImage) together with the classes that reference it,
      # which is what a re-implementation has to match.
      #
      # Allowed to fail: the artifact that matters (native libraries, dex,
      # report) is already produced by the previous step.
      - name: Decompile the libass classes with baksmali
        continue-on-error: true
        run: |
          curl -fSL --retry 5 --retry-all-errors --retry-delay 3 -o baksmali.jar \
            https://github.com/JesusFreke/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
          ls -l baksmali.jar
          mkdir -p smali
          for dex in out/dex/*.dex; do
            name="$(basename "$dex" .dex)"
            java -jar baksmali.jar d "$dex" -o "smali/$name" \
              || echo "::warning::baksmali could not decode $dex"
          done
          python3 - <<'PY'
          import os
          import shutil

          SRC = "smali"
          DST = "out/smali-libass"
          # The three names R8 kept are the anchors: anything that mentions them
          # belongs to the same feature, whatever it ended up being called.
          MARKERS = ("LibassNative", "LibassFrame", "LibassImage")

          copied = 0
          for root, _, files in os.walk(SRC):
              for name in files:
                  if not name.endswith(".smali"):
                      continue
                  path = os.path.join(root, name)
                  rel = os.path.relpath(path, SRC)
                  if "libass" in rel.lower():
                      hit = True
                  else:
                      hit = False
                      try:
                          with open(path, encoding="utf-8", errors="replace") as handle:
                              text = handle.read()
                      except OSError:
                          text = ""
                      for marker in MARKERS:
                          if marker in text:
                              hit = True
                              break
                  if not hit:
                      continue
                  target = os.path.join(DST, rel)
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  shutil.copyfile(path, target)
                  copied += 1

          print(f"libass-related smali files copied: {copied}")
          for root, _, files in os.walk(DST):
              for name in sorted(files)[:200]:
                  print("  " + os.path.relpath(os.path.join(root, name), DST))
          PY

      - name: Upload recon output
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-libass-recon
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Put report in the run summary
        run: |
          {
            echo '## Release APK recon'
            echo
            echo '```'
            cat out/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
